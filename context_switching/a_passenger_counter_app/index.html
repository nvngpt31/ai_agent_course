This file establishes the structure of the application, including the header, the dynamic counter text, interaction buttons, and the log for history entries.

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Passenger Counter App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Passenger Counter</h1>
        <h2 id="count-el">0</h2>
        
        <div class="btn-group">
            <button id="increment-btn" onclick="increment()">INCREMENT</button>
            <button id="save-btn" onclick="save()">SAVE</button>
        </div>

        <p id="save-el">Previous Entries: </p>
    </div>

    <script src="index.js"></script>
</body>
</html>
